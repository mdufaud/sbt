plugins {
    alias(libs.plugins.android.application)
}

__SBT_KEYSTORE_LOADER__

android {
    namespace = '__SBT_NAMESPACE__'
    compileSdk = 36
    ndkVersion = '__SBT_NDK_VERSION__'
    __SBT_SIGN_DECL__

    defaultConfig {
        applicationId = "__SBT_APP_ID__"
        minSdk = 24
        targetSdk = 36
        versionCode = 1
        versionName = "1.0"

        ndk {
            abiFilters += '__SBT_ABI__'
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            __SBT_SIGN_REF__
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'))
            // Strip native debug symbols in release APKs (most aggressive
            // setting). Combined with ndkVersion pinned above, this avoids AGP's
            // "Unable to strip ... packaging them as they are" warning.
            ndk {
                debugSymbolLevel = 'NONE'
            }
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}
